[assistant]
name = "R2"
domain = "macos_developer"
# Persona line only. Intents, rules and few-shot examples are generated from the
# intent registry in src/narrow_ai/models/prompt_templates.py (single source of truth).
system_prompt = """You are R2, a narrow, local macOS developer assistant (like Siri, but only for developer tasks in the user's active workspace)."""

[workspace]
# Empty = current working directory at launch
path = ""

[model]
backend = "mlx"  # fake | mlx   (tests always use fake)
model_id = "mlx-community/Qwen3-1.7B-4bit"
adapter_path = ""
max_tokens = 128
temperature = 0.0
max_history_turns = 3
exclusive_heavy_jobs = true
# KV cache: none | prefix | persistent  (persistent = prefix cache saved to artifacts/kv)
cache_mode = "persistent"
kv_cache_dir = ""
kv_cache_max_files = 8   # older persistent caches are evicted (LRU)
max_kv_size = 0
constrained = true
# Decode-time constraint: none | intent (intent name only) | json (whole decision via
# llguidance, `uv sync --group grammar`). Empty = derived from `constrained` above.
constraint = "json"   # measured best: see docs/EVALUATION.md (strict validation + json grammar)
few_shot = true

[tools]
allow_git_status = true
allow_git_diff = true
allow_search_files = true
allow_read_file = true
allow_run_tests = false
allow_open_app = true
command_timeout_sec = 30
max_output_chars = 8000
approved_apps = ["Terminal", "Visual Studio Code", "Cursor", "Xcode", "Safari", "Finder"]
# run_tests: off by default. It runs the *project's* code, so every run asks for
# confirmation. The model can only pick an id below; the argv is fixed here and runs
# without a shell (shells as argv[0] are refused). The first entry is the default.
test_timeout_sec = 300
explain_test_failures = true   # one extra text-only model call when a run fails

[tools.test_commands]
# unit = ["uv", "run", "python", "-m", "pytest", "-q"]
# lint = ["uv", "run", "ruff", "check", "."]
# swift = ["swift", "test"]

[memory]
enabled = true
# Empty = ~/.local/share/narrow-ai/preferences.db
db_path = ""
max_preferences = 100

[speech]
enabled = true
stt_backend = "mlx_whisper"
tts_backend = "kokoro"   # kokoro = natural neural voice (tts group) | macos_say
neural_voice = "af_heart"
whisper_model = "mlx-community/whisper-small-mlx"
sample_rate = 16000
voice = ""          # macOS `say` voice (fallback)
speak_replies = true
chimes = true

[logging]
level = "WARNING"
json = false

[security]
require_confirmation_for_writes = true
block_path_escape = true
redact_secrets_in_logs = true

[agent]
# Bounded multi-step runs ("check git status and then find the swift files").
# Every step goes through the same permission gate, validation and confirmation.
enabled = true
planner = "clauses"   # clauses (split on "and then"/"then"/";", route each clause) | model
split_and = true      # also split "X and Y" / "X, Y" when every part is a tool action
question_guard = true # "how do I rebase and then push?" is one question, not two steps
max_steps = 5
max_wall_sec = 60
persist_runs = true   # metadata only (intents, status), never tool output
